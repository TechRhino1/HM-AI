[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not network"
markers =
    network: tests that require live external network connectivity
    drawdown_persistence: opts out of the in-memory DrawdownGuard fixture in tests/conftest.py (needs a real sqlite file)
filterwarnings =
    ignore::DeprecationWarning
